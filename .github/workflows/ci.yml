name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zig-version: ['0.16.0', 'master']

    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ matrix.zig-version }}

    - name: Verify Zig installation
      run: zig version

    - name: Run tests
      run: |
        zig test src/test.zig

    - name: Build project
      run: zig build

    - name: Run build tests
      run: zig build test

    - name: Run benchmarks (zig build bench)
      continue-on-error: true
      run: |
        if zig build bench; then
          echo "✅ Benchmarks completed successfully"
        else
          echo "⚠️ Benchmarks failed, but continuing CI"
        fi

    - name: Check code format
      continue-on-error: true
      run: |
        if zig fmt --check build.zig src/; then
          echo "✅ Code formatting check passed"
        else
          echo "⚠️ Code formatting issues found, but not failing CI"
          echo "Run 'zig fmt build.zig src/' to fix formatting"
        fi
